version: "3.9"

services:
    db:
        image: postgres:17
        container_name: my_postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db_data:/var/lib/postgresql/data

    server:
        image: web-project1/server:latest
        restart: always
        ports:
            - "5000:5000"
        depends_on:
            - db
        environment:
            DATABASE_URL: ${DATABASE_URL}
            NODE_ENV: production
            PORT: 5000

    client:
        image: web-project1/client:latest
        restart: always
        ports:
            - "3000:3000"
        depends_on:
            - server
        environment:
            NODE_ENV: production
            NEXT_PUBLIC_API_URL: http://localhost:5000/api
            API_URL: http://server:5000/api

volumes:
    db_data:
