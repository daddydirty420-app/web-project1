version: '3.9'

services:
    db:
        image: postgres:17
        container_name: my_postgres
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '5432:5432'
        volumes:
            - db_data:/var/lib/postgresql/data

    server:
        build: ./server
        container_name: node_server
        restart: always
        ports:
            - '5000:5000'
        depends_on:
            - db
        environment:
            DOCKER: 'true'
            DATABASE_URL: ${DATABASE_URL}
            NODE_ENV: development
            PORT: 5000
            DB_SSL: 'false'
            COOKIE_DOMAIN: ${COOKIE_DOMAIN}
        volumes:
            - ./server:/app
            - /app/node_modules

    client:
        build: ./client
        container_name: next_client
        restart: always
        ports:
            - '3000:3000'
        depends_on:
            - server
        environment:
            NODE_ENV: development
            NEXT_PUBLIC_API_URL: http://localhost:5000/api # ブラウザ（クライアント）用
            API_URL: http://server:5000/api # サーバーサイド用（コンテナ間通信）
            WATCHPACK_POLLING: 'true'
        volumes:
            - ./client:/app
            - /app/node_modules
            - /app/.next

volumes:
    db_data:
