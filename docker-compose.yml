version: "3.9"

services:
  db:
    image: postgres:15
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: rykey893
      POSTGRES_DB: neondb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: node_server
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DOCKER: "true"
      DATABASE_URL: postgresql://neondb_owner:rykey893@db:5432/neondb
      NODE_ENV: development
      PORT: 5000
      DB_SSL: "false"
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    container_name: next_client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000/api      # ブラウザ（クライアント）用
      API_URL: http://server:5000/api                     # サーバーサイド用（コンテナ間通信）
      WATCHPACK_POLLING: "true"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data: